# Patient and Doctor frontends deployed together; FastAPI remains on Render.
[build]
  base = "."
  command = "set -e; rm -rf dist; mkdir -p dist/patient; cp maruthi/Health/index.html maruthi/Health/styles.css maruthi/Health/firebase-config.js maruthi/Health/firebase-service.js maruthi/Health/supabase-config.js maruthi/Health/api.js maruthi/Health/app.js dist/patient/; cp -R maruthi/Health/assets dist/patient/; echo \"window.HC_API_BASE_URL = '$HC_API_BASE_URL';\" > dist/patient/api-config.js; cd doctorsdashboard-main; npm ci; if [ -n \"$HC_API_BASE_URL\" ]; then export VITE_API_BASE_URL=\"${HC_API_BASE_URL%/}/api\"; fi; VITE_BASE_PATH=/doctor/ npm run build -- --outDir ../dist/doctor"
  publish = "dist"

# Doctor SPA entry point and deep links.
[[redirects]]
  from = "/doctor/login"
  to = "/doctor/index.html"
  status = 200

[[redirects]]
  from = "/doctor/*"
  to = "/doctor/index.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/patient/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/patient/index.html"
  status = 200
