# Netlify configuration for HealthContinuum AI
[build]
  base = "doctorsdashboard-main"
  command = "npm run build && mkdir -p dist/patient && cp -R ../maruthi/Health/. dist/patient/"
  publish = "dist"

# Keep the submitted hackathon URL, but serve the patient app.
[[redirects]]
  from = "/doctor/login"
  to = "/patient/index.html"
  status = 200

# Existing doctor login remains available at /login.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
