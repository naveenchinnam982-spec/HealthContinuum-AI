# Deploy the patient-first HealthContinuum app from maruthi/Health.
# Doctor URLs intentionally redirect to the patient dashboard; the old doctor source
# remains in the repository for rollback/review and is no longer built into this site.
[build]
  base = "."
  command = "set -e; rm -rf dist; mkdir -p dist/patient; cp maruthi/Health/index.html maruthi/Health/styles.css maruthi/Health/firebase-config.js maruthi/Health/firebase-service.js maruthi/Health/supabase-config.js maruthi/Health/api.js maruthi/Health/app.js dist/patient/; cp -R maruthi/Health/assets dist/patient/; echo \"window.HC_API_BASE_URL = '$HC_API_BASE_URL';\" > dist/patient/api-config.js"
  publish = "dist"

# Send every legacy doctor URL to the patient dashboard entry point.
[[redirects]]
  from = "/doctor/login"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/doctor/*"
  to = "/"
  status = 302
  force = true

# Patient SPA entry point and deep links.
[[redirects]]
  from = "/"
  to = "/patient/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/patient/index.html"
  status = 200
