# Deploy only the patient-first HealthContinuum app from maruthi/Health.
# Legacy doctor URLs redirect to the patient dashboard. Doctor source files are
# retained in the repository, but are not included in this site's deployed build.
# The external doctorsdashboard-main folder is not referenced or modified.
[build]
  base = "."
  command = "set -e; rm -rf dist; mkdir -p dist/patient; cp maruthi/Health/index.html maruthi/Health/styles.css maruthi/Health/firebase-config.js maruthi/Health/firebase-service.js maruthi/Health/supabase-config.js maruthi/Health/api.js maruthi/Health/app.js dist/patient/; cp -R maruthi/Health/assets dist/patient/; echo \"window.HC_API_BASE_URL = '${HC_API_BASE_URL:-https://healthcontinuum-api.onrender.com}';\" > dist/patient/api-config.js"
  publish = "dist"

[[redirects]]
  from = "/doctor/login"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/doctor/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/"
  to = "/patient/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/patient/index.html"
  status = 200
